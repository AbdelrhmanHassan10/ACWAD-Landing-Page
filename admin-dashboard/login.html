<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACWAD | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0a1121;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(249, 115, 22, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        .login-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 3.5rem 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(249, 115, 22, 0.1);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .header-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            margin: 0 auto 1.5rem;
            display: block;
            object-fit: cover;
            border: 2px solid rgba(249, 115, 22, 0.4);
            box-shadow: 0 15px 35px rgba(249, 115, 22, 0.2);
            background: rgba(255, 255, 255, 0.02);
            transition: transform 0.3s ease;
        }
        
        .header-icon:hover {
            transform: scale(1.05);
        }

        .login-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .login-header p {
            color: #a1a1aa;
            font-size: 1rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            text-align: left;
            direction: ltr;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f97316;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        .form-group input:focus + svg {
            color: #f97316;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Tajawal', sans-serif;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(234, 88, 12, 0.4);
            background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: none;
            text-align: center;
            font-weight: 500;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="../2.jpg" alt="ACWAD Logo" class="header-icon">
            <h1>ACWAD Admin</h1>
            <p>تسجيل الدخول للوحة التحكم</p>
        </div>

        <div id="error-message" class="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label>البريد الإلكتروني (Email)</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="[EMAIL_ADDRESS]">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور (Password)</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                <span>تسجيل الدخول</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; transform: rotate(180deg);"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDm1vyD8m9E3PGO2xoKlZsZ5Zka8mvgyHk",
            authDomain: "acwad-462f8.firebaseapp.com",
            databaseURL: "https://acwad-462f8-default-rtdb.firebaseio.com",
            projectId: "acwad-462f8",
            storageBucket: "acwad-462f8.firebasestorage.app",
            messagingSenderId: "1088179859100",
            appId: "1:1088179859100:web:b5773f9fa7e04d205a4759"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // If user is already logged in, redirect to index.html (dashboard)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px; height:20px; animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> جاري الدخول...';
            submitBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // The onAuthStateChanged listener will automatically redirect
            } catch (error) {
                console.error("Login error:", error);
                errorMsg.style.display = 'block';
                
                // Friendly error messages
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg.textContent = 'محاولات كثيرة خاطئة، يرجى المحاولة لاحقاً.';
                } else {
                    errorMsg.textContent = 'حدث خطأ أثناء تسجيل الدخول: ' + error.message;
                }
                
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
